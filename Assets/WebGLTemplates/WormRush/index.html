<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Worm Rush - playable ad</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0b12; overflow: hidden; }
    body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
           -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* A phone-shaped column: full width on a phone, a 9:16 strip centred on a desktop. */
    #stage { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
             height: 100%; width: min(100vw, calc(100vh * 9 / 16)); }
    @supports (height: 100dvh) { #stage { width: min(100vw, calc(100dvh * 9 / 16)); } }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #0b0b12; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 14px; font: 600 14px/1 system-ui, sans-serif; color: #8c8ca6; }
    #bar { width: 56%; height: 8px; border-radius: 4px; background: #1c1c2b; overflow: hidden; }
    #fill { width: 0; height: 100%; border-radius: 4px; background: #9bff3d; }
    #error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             padding: 24px; text-align: center; font: 15px/1.4 system-ui, sans-serif; color: #ff8a8a; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <div id="loading"><span>LOADING</span><div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var errorBox = document.querySelector("#error");

    function showError(message) {
      loading.style.display = "none";
      errorBox.textContent = String(message);
      errorBox.style.display = "flex";
    }

    // No context menu / long-press menu over the game.
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // A 3x phone screen would fill 9x the pixels of a 1x one; two is plenty for flat shapes.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    createUnityInstance(canvas, config, function (progress) {
      fill.style.width = (100 * progress) + "%";
    }).then(function () {
      loading.style.display = "none";
    }).catch(showError);
  </script>
</body>
</html>
